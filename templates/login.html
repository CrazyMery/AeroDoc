<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>AeroDoc Delta Login</title>

<style>

body{

    margin:0;

    height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e3a8a
    );

    font-family:
    'Segoe UI',
    sans-serif;
}

.login-card{

    width:420px;

    background:white;

    padding:40px;

    border-radius:20px;

    box-shadow:
    0 25px 60px
    rgba(0,0,0,.25);
}

.logo{

    text-align:center;

    font-size:34px;

    margin-bottom:10px;
}

h1{

    text-align:center;

    margin-bottom:25px;

    color:#185FA5;
}

input{

    width:100%;

    padding:12px;

    margin-top:10px;

    border:1px solid #ddd;

    border-radius:10px;
}

button{

    width:100%;

    margin-top:20px;

    padding:13px;

    border:none;

    border-radius:10px;

    background:#185FA5;

    color:white;

    font-weight:600;

    cursor:pointer;
}

button:hover{

    background:#0f4f8d;
}

.error{

    color:red;

    margin-bottom:15px;
}

.footer{

    text-align:center;

    margin-top:20px;

    color:#888;

    font-size:12px;
}

</style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        ✈️
    </div>

    <h1>AeroDoc Delta</h1>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form method="post">

        <input
            name="login"
            placeholder="Identifiant"
            required>

        <input
            type="password"
            name="password"
            placeholder="Mot de passe"
            required>

        <button type="submit">
            Se connecter
        </button>

    </form>

    <div class="footer">
        Delta Aerospace Document Management System
    </div>

</div>

</body>
</html>
